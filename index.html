<!doctype html>
<html lang="pt-PT" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>GPTCLONE — Uma LLM construída de raiz</title>
    <meta name="description" content="Projecto independente de investigação: desenvolvemos e treinamos uma LLM de raiz — tokenizer, Transformer, dados, treino e inferência podem ser nossos. Sem pesos pré-treinados de terceiros." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#040a13" />
    <meta property="og:site_name" content="GPTCLONE" />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='1' y='1' width='62' height='62' rx='14' fill='%23081120'/%3E%3Cpath d='M 47.5 21.5 A 19 19 0 1 0 47.5 42.5 L 47.5 34 L 36.5 34' fill='none' stroke='%234fd8ec' stroke-width='5' stroke-linecap='round'%3E%3C/path%3E%3Ccircle cx='47.5' cy='21.5' r='3.4' fill='%235b9cf9'/%3E%3Ccircle cx='47.5' cy='42.5' r='3.4' fill='%234fd8ec'/%3E%3Ccircle cx='17' cy='32' r='2.6' fill='%235b9cf9'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('gptclone.site:theme')
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (stored === null && systemDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (error) {
          // localStorage may be unavailable; the system preference stays in place.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
