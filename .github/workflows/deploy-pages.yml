# Desdobramento do website do GPTCLONE para o GitHub Pages.
# A publicação compila o site em Node 24 e publica a pasta dist/ (inclui o fallback
# 404.html do SPA). Requer: Settings → Pages → Source = GitHub Actions.
#
# Este workflow NÃO altera a visibilidade do repositório e não publica nada sem
# ter sido ativado por um push ou manualmente.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      WEBSITE_BASE_PATH:
        description: 'Base path do site (ex.: /about/ ou /)'
        required: false
        default: '/about/'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Build de produção
        env:
          WEBSITE_BASE_PATH: ${{ inputs.WEBSITE_BASE_PATH }}
        run: npm run build

      - name: Publicar artefacto do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desdobrar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
